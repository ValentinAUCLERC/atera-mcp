name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  # npm trusted publishing (OIDC) + provenance
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          [ "v${version}" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != package.json v${version}"; exit 1; }
      - name: Pack
        run: npm pack
      - name: Publish to npm
        # OIDC trusted publishing when configured on npmjs.com; NPM_TOKEN secret as fallback.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./atera-mcp-*.tgz --access public --provenance
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" atera-mcp-*.tgz --title "${GITHUB_REF_NAME}" --generate-notes
